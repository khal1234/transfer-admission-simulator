name: Deploy (Netlify)

# 2026-09-01 신설 — 지금까지 배포는 로컬 `netlify login`(소유자 개인 로그인)에 묶여
# 사실상 소유자만 배포할 수 있었다. workflow_dispatch는 이 저장소에 push 권한이 있는
# 사람 누구나 GitHub UI(Actions 탭)에서 수동으로 실행할 수 있다 — 개인 Netlify 계정
# 로그인을 나눠 주지 않고도 컨트리뷰터가 배포할 수 있게 여는 길이다.
#
# 필요한 저장소 시크릿(소유자가 GitHub 저장소 Settings > Secrets에서 직접 등록):
#   NETLIFY_AUTH_TOKEN — Netlify 개인 액세스 토큰 (app.netlify.com > User settings >
#     Applications > New access token). 이 값은 절대 코드나 채팅에 남기지 않는다.
# 사이트 ID(NETLIFY_SITE_ID)는 비밀이 아니다 — tools/netlify-site.ps1에 이미 커밋돼
# 있는 값과 같다.

on:
  workflow_dispatch:
    inputs:
      production:
        description: "프로덕션 게시 (월 한도 중 1회 소모) — 기본은 무료 프리뷰"
        type: boolean
        default: false
      message:
        description: "배포 메시지"
        type: string
        default: "ci deploy"

permissions:
  contents: write   # 배포 횟수 기록(기록/배포-횟수.txt)을 커밋하려면 필요

env:
  NETLIFY_SITE_ID: b798737f-59ef-4a3a-801d-727b80edf1c4   # tools/netlify-site.ps1 과 같은 값 — 비밀 아님

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/check_update_notice.py 는 git log --name-only 로 최근 커밋의
          # 변경 파일을 비교한다 — depth=1(기본값)이면 히스토리가 한 커밋뿐이라
          # git이 "이전 커밋과의 diff"가 아니라 트리 전체 파일 목록을 내놔서
          # 알림이 뒤처진 것처럼 오탐한다(2026-09-01 첫 CI 실행에서 발견).
          fetch-depth: 40

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 배포 한도 확인 (프로덕션일 때만)
        if: ${{ inputs.production == 'true' }}
        run: python3 tools/deploy_quota.py --check

      - name: 웹 의존성 설치
        working-directory: web
        run: npm ci

      - name: 업데이트 알림 동기화 확인
        run: python3 tools/check_update_notice.py

      - name: 테스트
        working-directory: web
        run: npm test

      - name: 빌드
        working-directory: web
        run: npm run build

      - name: Netlify CLI 설치
        run: npm install -g netlify-cli

      - name: Netlify 배포 — 프리뷰
        if: ${{ inputs.production != 'true' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: >
          netlify deploy --site="$NETLIFY_SITE_ID" --dir=web/dist --no-build
          --message="${{ inputs.message }}"

      - name: Netlify 배포 — 프로덕션
        if: ${{ inputs.production == 'true' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: >
          netlify deploy --site="$NETLIFY_SITE_ID" --dir=web/dist --no-build --prod
          --message="${{ inputs.message }}"

      - name: 배포 횟수 기록 + 커밋
        if: ${{ inputs.production == 'true' }}
        run: |
          python3 tools/deploy_quota.py --record
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 기록/배포-횟수.txt
          git diff --cached --quiet || git commit -m "배포 횟수 기록 [skip ci]"
          git push

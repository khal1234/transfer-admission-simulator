<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("t27_theme");
          const theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          const theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }
      })();
    </script>
    <title>국립대 9곳 편입 비교 — 내 TOEIC·학점으로 보는 3개년 합격 평균</title>
    <meta
      name="description"
      content="강원·경북·부경·부산·인천·전남·전북·충남·충북 9개 국립대의 2024~2026학년도 일반편입 합격 평균을 내 TOEIC·전적대 성적과 비교합니다. 참고용이며 지원 전 모집요강 확인이 필요합니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="국립대 9곳 편입 비교" />
    <meta
      property="og:description"
      content="9개 국립대의 2024~2026학년도 일반편입 합격 평균을 내 TOEIC·전적대 성적과 비교합니다. 참고용."
    />
    <meta property="og:locale" content="ko_KR" />
    <style>
      /* 화면 묶음을 받기 전에 보이는 안내. 묶음이 뜨면 #root 안이 통째로 바뀐다. */
      .boot-screen {
        display: flex;
        min-height: 70vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        color: #475569;
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        text-align: center;
      }
      html[data-theme="dark"] .boot-screen { color: #cbd5e1; }
      html[data-theme="dark"] body { background: #020617; }
      .boot-screen strong { font-size: 17px; }
      .boot-screen button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: #1e3a8a;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .boot-screen [hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" id="boot-screen">
        <strong>국립대 9곳 편입 비교</strong>
        <span id="boot-message">자료를 불러오는 중입니다…</span>
        <button type="button" id="boot-retry" hidden onclick="location.reload()">다시 시도</button>
      </div>
    </div>
    <noscript>이 사이트는 자바스크립트를 켜야 볼 수 있습니다.</noscript>
    <script>
      // 15초가 지나도 화면 묶음이 뜨지 않으면(느린 망·받기 실패) 그렇다고 알린다.
      // 예전에는 글자 하나 없는 흰 화면이었다(2026-11-14 검토 17번).
      (() => {
        const fail = (text) => {
          const message = document.getElementById("boot-message");
          const retry = document.getElementById("boot-retry");
          if (message === null || retry === null) return;
          message.textContent = text;
          retry.hidden = false;
        };
        setTimeout(() => fail("불러오는 데 시간이 걸리고 있습니다. 연결 상태를 확인한 뒤 다시 시도해 주세요."), 15000);
        addEventListener("error", (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement || target instanceof HTMLLinkElement) {
            fail("사이트 파일을 받지 못했습니다. 연결 상태를 확인한 뒤 다시 시도해 주세요.");
          }
        }, true);
        addEventListener("unhandledrejection", () => {
          if (document.getElementById("boot-screen") !== null) {
            fail("사이트 자료를 받지 못했습니다. 연결 상태를 확인한 뒤 다시 시도해 주세요.");
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
